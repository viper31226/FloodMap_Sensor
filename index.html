<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><title>Uni 3D map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  html, body, #map { margin: 0; height: 100%; }
  #ui { position: absolute; top: 10px; left: 10px; z-index: 2; background: #fff; padding: 8px 10px;
        border-radius: 6px; font: 14px sans-serif; box-shadow: 0 1px 4px #0005; max-width: 260px; }
  #ui .row { margin-bottom: 6px; }
  #ui button { cursor: pointer; border: 1px solid #888; background: #f4f4f4; padding: 4px 8px; border-radius: 4px; }
  #ui button.on { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  #note { font-size: 12px; color: #555; display: none; }
</style></head>
<body>
<div id="map"></div>
<div id="ui">
  <div class="row">Basemap:
    <button id="btnStreet" class="on">Street</button><button id="btnSat">Satellite</button></div>
  <div class="row">View:
    <button id="btnSurface" class="on">Surface 3D</button><button id="btnUnder">Underground</button></div>
  <div id="note"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// load all data first (needs http, not file://)
const get = f => fetch(f).then(r => { if (!r.ok) throw new Error(f + " -> " + r.status); return r.json(); });

Promise.all([get('meta.json'), get('buildings.geojson'), get('pipes.geojson'), get('area.geojson')])
  .then(([meta, BLD, PIPES, AREA]) => start(meta, BLD, PIPES, AREA))
  .catch(e => alert("Cannot load data: " + e.message + "\nOpen via http://localhost:8000 or GitHub Pages"));

function start(meta, BLD, PIPES, AREA) {
  const E = meta.exag;          // exaggeration used when building pipes
  const G = meta.ground_h;      // height (m) of the lifted ground plate in underground view

  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty',      // street basemap, no API key
    bounds: meta.bounds, fitBoundsOptions: { padding: 40 },
    pitch: 60, bearing: -20, maxPitch: 85
  });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

  map.on('load', () => {
    // hide the basemap's own 3D buildings
    map.getStyle().layers.filter(l => l.type === 'fill-extrusion')
      .forEach(l => map.setLayoutProperty(l.id, 'visibility', 'none'));

    // satellite (hidden by default), drawn above the street map, below everything else
    map.addSource('sat', {
      type: 'raster', tileSize: 256, maxzoom: 19,
      tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
      attribution: 'Imagery &copy; Esri'
    });
    map.addLayer({ id: 'sat', type: 'raster', source: 'sat', layout: { visibility: 'none' } });

    // layer order matters: pipes first, then translucent plate, then buildings on top
    map.addSource('pipes', { type: 'geojson', data: PIPES });
    map.addLayer({
      id: 'pipes3d', type: 'fill-extrusion', source: 'pipes', layout: { visibility: 'none' },
      paint: {
        // pipe bottom / top below the plate, depth and diameter scaled by E
        'fill-extrusion-base':   ['-', G, ['*', ['+', ['get', 'depth'], ['/', ['get', 'diam'], 2]], E]],
        'fill-extrusion-height': ['-', G, ['*', ['-', ['get', 'depth'], ['/', ['get', 'diam'], 2]], E]],
        'fill-extrusion-opacity': 1,
        'fill-extrusion-color': ['interpolate', ['linear'], ['get', 'diam'],
          0.4, '#4cc9f0', 0.8, '#1f6feb', 1.5, '#7209b7']
      }
    });

    map.addSource('area', { type: 'geojson', data: AREA });
    map.addLayer({
      id: 'plate', type: 'fill-extrusion', source: 'area', layout: { visibility: 'none' },
      paint: { 'fill-extrusion-base': G - 0.2, 'fill-extrusion-height': G,
               'fill-extrusion-color': '#8d6e63', 'fill-extrusion-opacity': 0.35 }
    });

    map.addSource('bld', { type: 'geojson', data: BLD });
    map.addLayer({
      id: 'bld3d', type: 'fill-extrusion', source: 'bld',
      paint: {
        'fill-extrusion-base': 0,
        'fill-extrusion-height': ['get', 'height_m'],
        'fill-extrusion-opacity': 0.9,
        'fill-extrusion-color': ['interpolate', ['linear'], ['get', 'height_m'],
          0, '#ffffb2', 10, '#fd8d3c', 30, '#bd0026', 60, '#4d004b']
      }
    });

    // popups
    map.on('click', 'bld3d', e => new maplibregl.Popup().setLngLat(e.lngLat)
      .setHTML('Height: <b>' + e.features[0].properties.height_m + ' m</b>').addTo(map));
    map.on('click', 'pipes3d', e => { const p = e.features[0].properties;
      new maplibregl.Popup().setLngLat(e.lngLat)
        .setHTML('Pipe (' + p.cls + ')<br>diameter <b>' + p.diam + ' m</b>, depth <b>' + p.depth +
                 ' m</b><br><i>assumed values</i>').addTo(map); });
    ['bld3d', 'pipes3d'].forEach(id => {
      map.on('mouseenter', id, () => map.getCanvas().style.cursor = 'pointer');
      map.on('mouseleave', id, () => map.getCanvas().style.cursor = '');
    });
  });

  // ---- buttons ----
  const $ = id => document.getElementById(id);
  const mark = (a, b) => { $(a).classList.add('on'); $(b).classList.remove('on'); };

  $('btnStreet').onclick = () => { map.setLayoutProperty('sat', 'visibility', 'none');    mark('btnStreet', 'btnSat'); };
  $('btnSat').onclick    = () => { map.setLayoutProperty('sat', 'visibility', 'visible'); mark('btnSat', 'btnStreet'); };

  $('btnSurface').onclick = () => {
    ['pipes3d', 'plate'].forEach(id => map.setLayoutProperty(id, 'visibility', 'none'));
    map.setPaintProperty('bld3d', 'fill-extrusion-base', 0);                       // buildings back on the ground
    map.setPaintProperty('bld3d', 'fill-extrusion-height', ['get', 'height_m']);
    map.setPaintProperty('bld3d', 'fill-extrusion-opacity', 0.9);
    map.easeTo({ pitch: 60 });
    $('note').style.display = 'none';
    mark('btnSurface', 'btnUnder');
  };
  $('btnUnder').onclick = () => {
    ['pipes3d', 'plate'].forEach(id => map.setLayoutProperty(id, 'visibility', 'visible'));
    map.setPaintProperty('bld3d', 'fill-extrusion-base', G);                       // buildings sit on the lifted plate
    map.setPaintProperty('bld3d', 'fill-extrusion-height', ['+', G, ['get', 'height_m']]);
    map.setPaintProperty('bld3d', 'fill-extrusion-opacity', 0.5);
    map.easeTo({ pitch: 50 });
    $('note').innerHTML = 'Scaled diagram: depth and pipe width x' + E +
                          '. Pipe sizes/depths are assumed by road class.';
    $('note').style.display = 'block';
    mark('btnUnder', 'btnSurface');
  };
}
</script></body></html>
